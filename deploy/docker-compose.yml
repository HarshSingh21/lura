# Lura — Phase 1 deployment (HLD §15: single VM, Docker Compose).
#
# Two profiles, because the split matters operationally:
#
#   core (default)  postgis + ntfy + lura            — the product
#   obs             collector + opensearch + jaeger  — the telemetry stack
#                   + prometheus + grafana
#
#   docker compose up -d                    # just the product
#   docker compose --profile obs up -d      # product + full observability
#
# Every image here is open-source licensed: PostgreSQL/PostGIS (PostgreSQL
# licence), ntfy (Apache-2.0/GPL-2.0), OpenTelemetry Collector (Apache-2.0),
# OpenSearch (Apache-2.0 — not Elastic-licensed Elasticsearch), Jaeger
# (Apache-2.0), Prometheus (Apache-2.0), Grafana (AGPL-3.0). See
# docs/open-source.md for the full inventory.

name: lura

services:
  # ---------------------------------------------------------------- data
  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: lura-postgres
    environment:
      POSTGRES_USER: lura
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lura}
      POSTGRES_DB: lura
      # Lura is the only writer and every query is user-scoped, so the defaults
      # are fine; this only silences the initdb warning about trust auth.
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # pg_isready alone returns true before PostGIS is installed; checking the
      # extension is what makes "healthy" mean "Lura can migrate".
      test: ["CMD-SHELL", "pg_isready -U lura -d lura && psql -U lura -d lura -tAc \"SELECT 1 FROM pg_extension WHERE extname='postgis'\" | grep -q 1 || pg_isready -U lura -d lura"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ---------------------------------------------------------------- push
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: lura-ntfy
    command: serve
    environment:
      NTFY_BASE_URL: http://ntfy:80
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      # Private by default: a self-hosted push server that anyone can publish to
      # is a spam relay.
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_BEHIND_PROXY: "true"
    volumes:
      - ntfy-data:/var/lib/ntfy
    ports:
      - "${NTFY_PORT:-8090}:80"
    restart: unless-stopped

  # ---------------------------------------------------------------- app
  lura:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: lura
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LURA_HTTP_ADDR: ":8080"
      LURA_PUBLIC_BASE_URL: ${LURA_PUBLIC_BASE_URL:-http://localhost:8080}
      LURA_STORE: postgres
      LURA_DATABASE_URL: postgres://lura:${POSTGRES_PASSWORD:-lura}@postgres:5432/lura?sslmode=disable
      LURA_MIGRATE: "true"
      LURA_SEED: "${LURA_SEED:-true}"

      # Change this before exposing the server. Phase 1 auth is a static bearer
      # token (HLD §16); Zitadel-issued JWTs land in Phase 2.
      LURA_API_TOKEN: ${LURA_API_TOKEN:-lura-dev-token}
      LURA_DEVICE_TOKEN: ${LURA_DEVICE_TOKEN:-}

      # Geofence tuning — every one of these is an open product default (HLD §17).
      LURA_FRESH_WINDOW: ${LURA_FRESH_WINDOW:-5m}
      LURA_ARRIVE_DEBOUNCE: ${LURA_ARRIVE_DEBOUNCE:-45s}
      LURA_ARRIVE_MAX_SPEED_MPS: ${LURA_ARRIVE_MAX_SPEED_MPS:-1.5}
      LURA_PASSBY_MIN_SPEED_MPS: ${LURA_PASSBY_MIN_SPEED_MPS:-3.0}
      LURA_COOLOFF: ${LURA_COOLOFF:-30m}
      LURA_RETENTION_DAYS: ${LURA_RETENTION_DAYS:-90}

      # Push: the self-hosted ntfy above. A topic must be set for it to be used.
      LURA_NTFY_URL: http://ntfy:80
      LURA_NTFY_TOPIC: ${LURA_NTFY_TOPIC:-}

      # Observability. Empty OTLP endpoint = no egress at all, which is also what
      # airgap mode enforces regardless of these values.
      LURA_OTLP_ENDPOINT: ${LURA_OTLP_ENDPOINT:-}
      LURA_OPENSEARCH_URL: ${LURA_OPENSEARCH_URL:-}
      LURA_ENV: ${LURA_ENV:-development}
      LURA_LOG_FORMAT: ${LURA_LOG_FORMAT:-json}
      LURA_LOG_LEVEL: ${LURA_LOG_LEVEL:-info}
      LURA_AIRGAP: ${LURA_AIRGAP:-false}

      # Maps: OpenFreeMap in Phase 1, self-hosted PMTiles in Phase 2 (HLD §13).
      LURA_MAP_STYLE_URL: ${LURA_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/positron}
    ports:
      - "${LURA_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/lura-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------- telemetry
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: lura-otel-collector
    profiles: ["obs"]
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP — what the Go app uses
      - "8889:8889" # Prometheus scrape endpoint for collector-side metrics
    depends_on:
      - opensearch
      - jaeger
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2
    container_name: lura-opensearch
    profiles: ["obs"]
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      # A single-node local log store does not need TLS and demo credentials; do
      # not carry this into a deployment that anyone else can reach.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2
    container_name: lura-opensearch-dashboards
    profiles: ["obs"]
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      - opensearch
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: lura-jaeger
    profiles: ["obs"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: lura-prometheus
    profiles: ["obs"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: lura-grafana
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-lura}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/lura.yaml:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  ntfy-data:
  opensearch-data:
  prometheus-data:
  grafana-data:
