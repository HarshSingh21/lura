# OpenTelemetry Collector — the only component that knows where telemetry goes.
#
# Lura exports OTLP/HTTP to this collector and nothing else (HLD §12). Routing
# logs to OpenSearch, traces to Jaeger and metrics to Prometheus is a
# configuration concern, so changing a backend never touches the application.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Batching is what keeps a burst of position fixes from becoming a burst of
  # tiny exports.
  batch:
    timeout: 5s
    send_batch_size: 512
  memory_limiter:
    check_interval: 2s
    limit_percentage: 75
    spike_limit_percentage: 20
  resourcedetection:
    detectors: [env, system]
    timeout: 2s

exporters:
  # Logs → OpenSearch, in daily indices matching what the app's direct shipper
  # writes, so both paths land in one place.
  opensearch:
    http:
      endpoint: http://opensearch:9200
      tls:
        insecure: true
    logs_index: lura-logs
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s

  # Traces → Jaeger's OTLP endpoint.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Metrics → a Prometheus scrape endpoint on the collector.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [opensearch]
